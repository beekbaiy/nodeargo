<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon SpeedTest | NextGen Network Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            cyan: '#00f3ff',
                            purple: '#b500ff',
                            pink: '#ff0055',
                            dark: '#0a0b10',
                            panel: '#12141d'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3)',
                        'neon-purple': '0 0 10px rgba(181, 0, 255, 0.5), 0 0 20px rgba(181, 0, 255, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(181, 0, 255, 0.04) 0%, transparent 50%),
                linear-gradient(to bottom, transparent, rgba(0,0,0,0.8));
            color: white;
            overflow-x: hidden;
            user-select: none;
        }

        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .text-glow-purple {
            text-shadow: 0 0 8px rgba(181, 0, 255, 0.8), 0 0 20px rgba(181, 0, 255, 0.4);
        }

        /* Speedometer SVG Styles */
        .meter-track {
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 14;
            fill: none;
        }
        
        .meter-fill-dl {
            stroke: #00f3ff;
            stroke-width: 14;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px #00f3ff) drop-shadow(0 0 20px rgba(0,243,255,0.6));
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .meter-fill-ul {
            stroke: #b500ff;
            stroke-width: 14;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px #b500ff) drop-shadow(0 0 20px rgba(181,0,255,0.6));
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .meter-tick {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2;
        }

        .meter-tick-major {
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 3;
        }

        .meter-label {
            fill: rgba(255, 255, 255, 0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: central;
        }

        #needle-group {
            transform-origin: 250px 250px;
            /* -90deg is 0 on the dial, +90deg is Max */
            transform: rotate(-90deg);
            transition: transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .needle {
            fill: #fff;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
        }

        .needle-center {
            fill: #0a0b10;
            stroke: #00f3ff;
            stroke-width: 4;
            filter: drop-shadow(0 0 8px rgba(0,243,255,0.8));
            transition: stroke 0.3s ease;
        }

        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        
        .anim-pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes scan-line {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .node-item {
            transition: all 0.3s ease;
        }
        .node-item.testing {
            border-color: #00f3ff;
            background-color: rgba(0, 243, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .node-item.selected {
            border-color: #b500ff;
            background-color: rgba(181, 0, 255, 0.1);
            box-shadow: 0 0 15px rgba(181, 0, 255, 0.3);
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(18, 20, 29, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-rajdhani selection:bg-neon-cyan selection:text-black">

    <header class="w-full p-6 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <h1 class="text-2xl font-orbitron font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-white">NEON<span class="text-white font-light">TEST</span></h1>
        </div>
        <div class="text-gray-400 text-sm font-semibold tracking-wider flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neon-cyan opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-neon-cyan"></span>
            </span>
            SYSTEM ONLINE
        </div>
    </header>

    <main class="flex-grow flex flex-col lg:flex-row items-center justify-center p-4 lg:p-8 gap-8 w-full max-w-7xl mx-auto z-10 relative">
        
        <!-- Left Column: Node Selection & Status (Hidden initially on mobile, moved down later) -->
        <div id="node-panel" class="w-full lg:w-1/4 glass-panel rounded-2xl p-5 flex flex-col gap-4 h-auto lg:h-[500px] order-2 lg:order-1 transition-opacity duration-500">
            <div class="border-b border-gray-800 pb-3 flex justify-between items-end">
                <h2 class="font-orbitron text-gray-300 text-sm tracking-widest">ROUTING PROTOCOL</h2>
                <span id="test-phase-label" class="text-neon-cyan text-xs font-bold animate-pulse">STANDBY</span>
            </div>
            
            <div id="node-list" class="flex flex-col gap-2 overflow-y-auto pr-1 flex-grow">
                <!-- Nodes populated by JS -->
            </div>

            <div class="mt-auto pt-4 border-t border-gray-800 text-xs text-gray-500">
                CLIENT IP: <span class="text-gray-300">192.168.x.x (Simulated)</span><br>
                ISP: <span class="text-gray-300">CyberNet Global</span>
            </div>
        </div>

        <!-- Center Column: The Dashboard & SVG Speedometer -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center order-1 lg:order-2 relative">
            
            <!-- Dynamic Speed Display overlaid on meter -->
            <div class="absolute top-[45%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center z-10 w-full">
                <div id="current-speed" class="text-6xl md:text-8xl font-orbitron font-bold text-white tracking-tighter tabular-nums drop-shadow-lg">0.00</div>
                <div id="current-unit" class="text-lg md:text-xl text-gray-400 font-bold tracking-widest mt-1 uppercase transition-colors duration-300">Mbps</div>
                <div id="active-mode-label" class="mt-6 text-sm font-orbitron tracking-[0.3em] text-gray-600 opacity-0 transition-opacity duration-300">DOWNLOAD</div>
            </div>

            <!-- SVG Container -->
            <div class="w-full max-w-[500px] aspect-[2/1.1] relative">
                <svg id="speedometer" viewBox="0 0 500 280" class="w-full h-full drop-shadow-2xl overflow-visible">
                    <defs>
                        <!-- Glow Filters mapped later by CSS but good practice to have options here -->
                        <linearGradient id="dl-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0055ff"/>
                            <stop offset="100%" stop-color="#00f3ff"/>
                        </linearGradient>
                    </defs>

                    <!-- Background Arc -->
                    <path class="meter-track" d="M 50 250 A 200 200 0 0 1 450 250" />
                    
                    <!-- Progress Arc (Controlled via JS stroke-dashoffset) -->
                    <!-- Dasharray is approx pi * radius = 3.14159 * 200 = 628.32 -->
                    <!-- To hide it, dashoffset = 628.32. To fill, dashoffset = 0 -->
                    <path id="meter-progress" class="meter-fill-dl" d="M 50 250 A 200 200 0 0 1 450 250" stroke-dasharray="628.32" stroke-dashoffset="628.32" />

                    <!-- Dynamic Ticks Group -->
                    <g id="ticks-group">
                        <!-- Populated by JS -->
                    </g>

                    <!-- Needle Assembly -->
                    <g id="needle-group">
                        <!-- The needle line/polygon -->
                        <polygon class="needle" points="247,250 253,250 251,60 249,60" />
                        <line x1="250" y1="250" x2="250" y2="40" stroke="#fff" stroke-width="2" filter="drop-shadow(0 0 4px #fff)"/>
                        
                        <!-- Glow highlight on needle tip -->
                        <circle cx="250" cy="40" r="3" fill="#fff" filter="drop-shadow(0 0 5px #00f3ff)"/>
                    </g>
                    
                    <!-- Center Cap covering needle base -->
                    <circle cx="250" cy="250" r="18" class="needle-center" id="needle-cap"/>
                    <circle cx="250" cy="250" r="6" fill="#12141d" />
                </svg>
            </div>

            <!-- Start Action Area -->
            <div class="mt-[-20px] z-20">
                <button id="btn-start" class="relative group cursor-pointer border-none bg-transparent outline-none">
                    <div class="absolute inset-0 bg-neon-cyan rounded-full blur-md opacity-40 group-hover:opacity-70 group-active:opacity-100 transition-opacity duration-300"></div>
                    <div class="relative w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-neon-cyan bg-neon-dark flex items-center justify-center glass-panel overflow-hidden transition-transform duration-100 group-active:scale-95">
                        <div class="absolute inset-0 bg-gradient-to-tr from-transparent to-neon-cyan opacity-10 group-hover:opacity-30 transition-opacity duration-300"></div>
                        <span id="btn-text" class="font-orbitron text-2xl md:text-3xl font-bold text-white group-hover:text-glow-cyan transition-all duration-300">GO</span>
                    </div>
                </button>
            </div>

        </div>

        <!-- Right Column: Results Metrics -->
        <div class="w-full lg:w-1/4 flex flex-col gap-4 order-3">
            
            <!-- Ping & Jitter Row -->
            <div class="flex gap-4 w-full">
                <div class="glass-panel p-4 rounded-2xl flex-1 flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="bg-glow-ping" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-500 rounded-2xl"></div>
                    <span class="text-gray-500 text-xs font-bold tracking-widest mb-1 z-10 flex items-center gap-1">
                        PING
                    </span>
                    <div class="flex items-baseline gap-1 z-10">
                        <span id="res-ping" class="text-2xl font-orbitron font-bold text-white">-</span>
                        <span class="text-xs text-gray-500">ms</span>
                    </div>
                </div>
                
                <div class="glass-panel p-4 rounded-2xl flex-1 flex flex-col items-center justify-center relative overflow-hidden">
                     <div id="bg-glow-jitter" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-500 rounded-2xl"></div>
                    <span class="text-gray-500 text-xs font-bold tracking-widest mb-1 z-10">JITTER</span>
                    <div class="flex items-baseline gap-1 z-10">
                        <span id="res-jitter" class="text-2xl font-orbitron font-bold text-white">-</span>
                        <span class="text-xs text-gray-500">ms</span>
                    </div>
                </div>
            </div>

            <!-- Download Panel -->
            <div class="glass-panel p-5 rounded-2xl flex flex-col relative overflow-hidden border-l-4 border-l-gray-800 transition-colors duration-300" id="panel-dl">
                <div class="absolute right-0 top-0 w-32 h-32 bg-neon-cyan opacity-5 blur-3xl rounded-full translate-x-1/2 -translate-y-1/2"></div>
                <div class="flex justify-between items-center mb-2 z-10">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-gray-600 transition-colors duration-300" id="icon-dl" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="text-gray-400 text-sm font-bold tracking-widest">DOWNLOAD</span>
                    </div>
                    <div id="progress-dl" class="w-16 h-1 bg-gray-800 rounded-full overflow-hidden hidden">
                        <div class="h-full bg-neon-cyan w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <div class="flex items-baseline gap-1 z-10">
                    <span id="res-dl" class="text-4xl font-orbitron font-bold text-gray-700 transition-colors duration-300">-</span>
                </div>
                <!-- Sparkline container (decorative) -->
                <div class="w-full h-8 mt-2 flex items-end gap-[2px] opacity-30" id="spark-dl"></div>
            </div>

            <!-- Upload Panel -->
            <div class="glass-panel p-5 rounded-2xl flex flex-col relative overflow-hidden border-l-4 border-l-gray-800 transition-colors duration-300" id="panel-ul">
                 <div class="absolute right-0 top-0 w-32 h-32 bg-neon-purple opacity-5 blur-3xl rounded-full translate-x-1/2 -translate-y-1/2"></div>
                <div class="flex justify-between items-center mb-2 z-10">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-gray-600 transition-colors duration-300" id="icon-ul" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <span class="text-gray-400 text-sm font-bold tracking-widest">UPLOAD</span>
                    </div>
                    <div id="progress-ul" class="w-16 h-1 bg-gray-800 rounded-full overflow-hidden hidden">
                        <div class="h-full bg-neon-purple w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <div class="flex items-baseline gap-1 z-10">
                    <span id="res-ul" class="text-4xl font-orbitron font-bold text-gray-700 transition-colors duration-300">-</span>
                </div>
                <!-- Sparkline container (decorative) -->
                <div class="w-full h-8 mt-2 flex items-end gap-[2px] opacity-30" id="spark-ul"></div>
            </div>

        </div>
    </main>

    <script>
        /**
         * Neon SpeedTest Simulation Engine
         * Implements a realistic, physics-based UI simulation of network testing.
         */

        // Configuration & Constants
        const CONFIG = {
            arcRadius: 200,
            arcLength: 3.14159 * 200, // ~628.32
            maxSpeedDisplay: 1000,
            // Speed scale milestones for non-linear mapping [speed, angle from -90]
            // Scale points: 0, 1, 10, 50, 100, 500, 1000 Mbps mapped across 180 degrees
            scale: [
                { s: 0, a: -90 },
                { s: 1, a: -60 },
                { s: 10, a: -30 },
                { s: 50, a: 0 },
                { s: 100, a: 30 },
                { s: 500, a: 60 },
                { s: 1000, a: 90 }
            ],
            colors: {
                idle: 'rgba(255,255,255,0.05)',
                cyan: '#00f3ff',
                purple: '#b500ff'
            }
        };

        // Simulated Network Nodes
        const NODES = [
            { id: 'n1', name: 'Beijing, CN', provider: 'China Telecom', lat: 39.9, basePing: 35 },
            { id: 'n2', name: 'Shanghai, CN', provider: 'China Unicom', lat: 31.2, basePing: 12 },
            { id: 'n3', name: 'Guangzhou, CN', provider: 'China Mobile', lat: 23.1, basePing: 28 },
            { id: 'n4', name: 'Hong Kong, SAR', provider: 'HKBN', lat: 22.3, basePing: 45 },
            { id: 'n5', name: 'Tokyo, JP', provider: 'NTT', lat: 35.6, basePing: 65 },
            { id: 'n6', name: 'Los Angeles, US', provider: 'Cogent', lat: 34.0, basePing: 140 }
        ];

        // State Machine
        let STATE = {
            status: 'IDLE', // IDLE, ROUTING, PING, DOWNLOAD, UPLOAD, DONE
            selectedNode: null,
            currentSpeed: 0,
            targetSpeed: 0,
            needleAngle: -90,
            needleVelocity: 0,
            results: { ping: 0, jitter: 0, dl: 0, ul: 0 },
            animationFrame: null,
            phaseProgress: 0, // 0 to 1
            sparklineData: { dl: [], ul: [] }
        };

        // DOM Elements setup
        const DOM = {
            btnStart: document.getElementById('btn-start'),
            btnText: document.getElementById('btn-text'),
            nodeList: document.getElementById('node-list'),
            phaseLabel: document.getElementById('test-phase-label'),
            speedText: document.getElementById('current-speed'),
            unitText: document.getElementById('current-unit'),
            modeLabel: document.getElementById('active-mode-label'),
            meterProgress: document.getElementById('meter-progress'),
            needleGroup: document.getElementById('needle-group'),
            needleCap: document.getElementById('needle-cap'),
            resPing: document.getElementById('res-ping'),
            resJitter: document.getElementById('res-jitter'),
            resDl: document.getElementById('res-dl'),
            resUl: document.getElementById('res-ul'),
            panelDl: document.getElementById('panel-dl'),
            panelUl: document.getElementById('panel-ul'),
            iconDl: document.getElementById('icon-dl'),
            iconUl: document.getElementById('icon-ul'),
            progDl: document.getElementById('progress-dl').firstElementChild,
            progUl: document.getElementById('progress-ul').firstElementChild,
            sparkDl: document.getElementById('spark-dl'),
            sparkUl: document.getElementById('spark-ul'),
        };

        // Utilities
        const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
        const lerp = (start, end, factor) => start + (end - start) * factor;
        const randRange = (min, max) => Math.random() * (max - min) + min;
        
        // Non-linear mapping function: Speed -> Angle
        function speedToAngle(speed) {
            if (speed <= 0) return CONFIG.scale[0].a;
            if (speed >= CONFIG.maxSpeedDisplay) return CONFIG.scale[CONFIG.scale.length - 1].a;

            for (let i = 0; i < CONFIG.scale.length - 1; i++) {
                const s1 = CONFIG.scale[i], s2 = CONFIG.scale[i + 1];
                if (speed >= s1.s && speed <= s2.s) {
                    // Linear interpolate within the segment
                    const percentage = (speed - s1.s) / (s2.s - s1.s);
                    return s1.a + (s2.a - s1.a) * percentage;
                }
            }
            return 90;
        }

        // Generate SVG Ticks based on the scale
        function generateMeterTicks() {
            const ticksGroup = document.getElementById('ticks-group');
            let svgContent = '';
            
            // Major ticks based on scale array
            CONFIG.scale.forEach(point => {
                // Convert angle (-90 to 90) to SVG polar coordinates (180 to 360)
                // -90deg rotation in CSS corresponds to 180deg in standard SVG circle geometry starting from right
                // Math: angle from horizontal left
                const angleRad = (point.a + 90) * (Math.PI / 180); // 0 to PI
                // Map to SVG arc drawn from left (180 deg) to right (0 deg)
                // Center is 250, 250. Radius is 200.
                const cx = 250, cy = 250, rOuter = 200, rInner = 185;
                
                // Angle 0 here is left side.
                const mathAngle = Math.PI - angleRad; 
                
                const x1 = cx + rOuter * Math.cos(mathAngle);
                const y1 = cy - rOuter * Math.sin(mathAngle);
                const x2 = cx + rInner * Math.cos(mathAngle);
                const y2 = cy - rInner * Math.sin(mathAngle);
                
                svgContent += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="meter-tick-major" />`;
                
                // Label positioning (push outwards)
                const rLabel = 225;
                const lx = cx + rLabel * Math.cos(mathAngle);
                const ly = cy - rLabel * Math.sin(mathAngle);
                
                // Only show select labels
                if([0, 10, 100, 500, 1000].includes(point.s)) {
                     svgContent += `<text x="${lx}" y="${ly}" class="meter-label">${point.s}</text>`;
                }
            });

            // Minor ticks (fill in gaps linearly within angles)
            for (let angle = -90; angle <= 90; angle += 3) {
                // Skip if close to major tick
                if (CONFIG.scale.some(p => Math.abs(p.a - angle) < 1.5)) continue;
                
                const angleRad = (angle + 90) * (Math.PI / 180);
                const mathAngle = Math.PI - angleRad;
                const cx = 250, cy = 250, rOuter = 200, rInner = 193;
                
                const x1 = cx + rOuter * Math.cos(mathAngle);
                const y1 = cy - rOuter * Math.sin(mathAngle);
                const x2 = cx + rInner * Math.cos(mathAngle);
                const y2 = cy - rInner * Math.sin(mathAngle);
                
                svgContent += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="meter-tick" />`;
            }

            ticksGroup.innerHTML = svgContent;
        }

        // Build Node List UI
        function renderNodes() {
            DOM.nodeList.innerHTML = NODES.map(node => `
                <div id="node-${node.id}" class="node-item border border-gray-800 rounded-lg p-3 flex justify-between items-center bg-gray-900/50 cursor-default">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-gray-200">${node.name}</span>
                        <span class="text-xs text-gray-500">${node.provider}</span>
                    </div>
                    <div class="ping-indicator text-xs font-orbitron text-gray-600">-- ms</div>
                </div>
            `).join('');
        }

        // Core Render Loop (Physics & UI Updates)
        function renderLoop(time) {
            if (STATE.status !== 'IDLE') {
                // Needle Physics Engine
                // Simulating inertia, spring force, and jitter
                const targetA = speedToAngle(STATE.currentSpeed);
                
                // Spring behavior: acceleration towards target
                let force = (targetA - STATE.needleAngle) * 0.15; // Stiffness
                
                // Damping
                STATE.needleVelocity *= 0.7; // Friction
                STATE.needleVelocity += force;
                
                // Add mechanical jitter if active
                if (STATE.status === 'DOWNLOAD' || STATE.status === 'UPLOAD' || STATE.status === 'PING') {
                    // Small high frequency noise
                    STATE.needleAngle += randRange(-0.5, 0.5); 
                }

                STATE.needleAngle += STATE.needleVelocity;
                
                // Hard limits
                STATE.needleAngle = clamp(STATE.needleAngle, -95, 95);

                // Update SVG Transforms
                DOM.needleGroup.style.transform = `rotate(${STATE.needleAngle}deg)`;
                
                // Update Progress Arc
                // Map angle back to 0-1 range for dashoffset
                // angle goes -90 to +90. Map to 0 to 180. Ratio = (angle+90)/180.
                let fillRatio = (STATE.needleAngle + 90) / 180;
                fillRatio = clamp(fillRatio, 0, 1);
                
                // offset = totalLength - (totalLength * ratio)
                const offset = CONFIG.arcLength * (1 - fillRatio);
                DOM.meterProgress.style.strokeDashoffset = offset;

                // Update Big Number Display
                if (STATE.status === 'DOWNLOAD' || STATE.status === 'UPLOAD') {
                    // Smooth speed text update
                    DOM.speedText.textContent = STATE.currentSpeed.toFixed(2);
                } else if (STATE.status === 'DONE') {
                    // Keep final visual
                }
            }

            STATE.animationFrame = requestAnimationFrame(renderLoop);
        }

        // Helper to update sparklines
        function pushSparkline(type, value) {
            const arr = STATE.sparklineData[type];
            arr.push(value);
            if (arr.length > 30) arr.shift(); // Keep last 30 frames
            
            const container = type === 'dl' ? DOM.sparkDl : DOM.sparkUl;
            const maxVal = Math.max(...arr, 1); // prevent /0
            const color = type === 'dl' ? 'bg-neon-cyan' : 'bg-neon-purple';
            
            container.innerHTML = arr.map(v => {
                const heightPct = (v / maxVal) * 100;
                return `<div class="w-1 ${color} opacity-80 rounded-t-sm" style="height: ${heightPct}%"></div>`;
            }).join('');
        }

        // --- TEST PHASES ---

        async function phaseRouting() {
            STATE.status = 'ROUTING';
            DOM.phaseLabel.textContent = 'FINDING OPTIMAL NODE...';
            DOM.phaseLabel.className = 'text-neon-cyan text-xs font-bold animate-pulse';
            
            let bestNode = null;
            let lowestPing = 999;

            // Sequential scanning effect
            for (let i = 0; i < NODES.length; i++) {
                const node = NODES[i];
                const el = document.getElementById(`node-${node.id}`);
                const pingEl = el.querySelector('.ping-indicator');
                
                // Highlight as testing
                el.classList.add('testing');
                
                // Simulate network request delay
                await new Promise(r => setTimeout(r, 200 + Math.random() * 300));
                
                // Simulate ping calculation based on basePing + noise
                const simulatedPing = Math.floor(node.basePing * randRange(0.9, 1.3));
                pingEl.textContent = `${simulatedPing} ms`;
                pingEl.classList.replace('text-gray-600', 'text-neon-cyan');
                
                el.classList.remove('testing');

                if (simulatedPing < lowestPing) {
                    lowestPing = simulatedPing;
                    bestNode = node;
                }
            }

            // Highlight chosen node
            STATE.selectedNode = bestNode;
            STATE.results.ping = lowestPing; // preliminary
            
            const bestEl = document.getElementById(`node-${bestNode.id}`);
            bestEl.classList.add('selected');
            bestEl.querySelector('.ping-indicator').classList.replace('text-neon-cyan', 'text-neon-purple');
            
            await new Promise(r => setTimeout(r, 500));
        }

        async function phasePing() {
            STATE.status = 'PING';
            DOM.phaseLabel.textContent = 'MEASURING LATENCY';
            DOM.phaseLabel.className = 'text-gray-300 text-xs font-bold';
            
            DOM.modeLabel.textContent = "LATENCY";
            DOM.modeLabel.style.opacity = '1';
            DOM.unitText.textContent = "ms";

            const elBg = document.getElementById('bg-glow-ping');
            elBg.classList.replace('opacity-0', 'opacity-10');
            elBg.classList.add('bg-neon-cyan');

            let pings = [];
            // Simulate sending 10 ping packets
            for(let i=0; i<10; i++) {
                // Base ping + variance
                let val = STATE.selectedNode.basePing + randRange(-5, 15);
                if (val < 1) val = 1;
                pings.push(val);
                
                // Visual feedback on big dial
                STATE.currentSpeed = val; // Temporarily map ping to dial for cool effect
                DOM.speedText.textContent = val.toFixed(0);
                DOM.resPing.textContent = val.toFixed(0);
                
                await new Promise(r => setTimeout(r, 150));
            }

            // Calculate final
            const avgPing = pings.reduce((a,b)=>a+b,0) / pings.length;
            
            // Calculate Jitter (average absolute deviation)
            let jitterSum = 0;
            for(let i=1; i<pings.length; i++) {
                jitterSum += Math.abs(pings[i] - pings[i-1]);
            }
            const jitter = jitterSum / (pings.length - 1);

            STATE.results.ping = avgPing;
            STATE.results.jitter = jitter;
            
            DOM.resPing.textContent = Math.round(avgPing);
            DOM.resPing.classList.replace('text-white', 'text-neon-cyan');
            DOM.resPing.classList.add('text-glow-cyan');
            
            document.getElementById('bg-glow-jitter').classList.replace('opacity-0', 'opacity-10');
            document.getElementById('bg-glow-jitter').classList.add('bg-neon-cyan');
            
            DOM.resJitter.textContent = Math.max(1, Math.round(jitter));
            DOM.resJitter.classList.replace('text-white', 'text-neon-cyan');

            STATE.currentSpeed = 0; // reset dial
            await new Promise(r => setTimeout(r, 800));
            
            elBg.classList.remove('opacity-10');
            document.getElementById('bg-glow-jitter').classList.remove('opacity-10');
        }

        async function phaseDownload() {
            STATE.status = 'DOWNLOAD';
            DOM.phaseLabel.textContent = 'DOWNLOADING DATA';
            DOM.modeLabel.textContent = "DOWNLOAD";
            DOM.unitText.textContent = "Mbps";
            
            // UI Styling setup
            DOM.meterProgress.className = 'meter-fill-dl';
            DOM.needleCap.style.stroke = CONFIG.colors.cyan;
            DOM.panelDl.classList.replace('border-l-gray-800', 'border-l-neon-cyan');
            DOM.panelDl.classList.replace('text-gray-700', 'text-white');
            DOM.iconDl.classList.replace('text-gray-600', 'text-neon-cyan');
            DOM.progDl.parentElement.classList.remove('hidden');
            DOM.resDl.classList.replace('text-gray-700', 'text-white');

            // Simulation parameters
            // Simulate a user having a 500-800Mbps connection, affected by distance to node
            const maxCap = 800 - (STATE.selectedNode.basePing * 2); 
            const targetMax = Math.max(100, maxCap); // min 100Mbps
            
            let timeElapsed = 0;
            const duration = 8000; // 8 seconds test
            const interval = 50; // update frequency
            
            return new Promise(resolve => {
                const timer = setInterval(() => {
                    timeElapsed += interval;
                    const progress = timeElapsed / duration;
                    DOM.progDl.style.width = `${progress * 100}%`;

                    if (progress >= 1) {
                        clearInterval(timer);
                        finalizePhase('dl');
                        resolve();
                        return;
                    }

                    // Speed Curve Generator
                    if (progress < 0.2) {
                        // Ramp up phase (0 to 20%)
                        STATE.targetSpeed = lerp(0, targetMax * 0.9, progress / 0.2);
                    } else if (progress > 0.8) {
                        // Ramp down / stabilization phase (80 to 100%)
                        // Hold near max
                        STATE.targetSpeed = targetMax * randRange(0.95, 1.05);
                    } else {
                        // Sustain phase (20 to 80%) with sine wave oscillation and noise
                        const wave = Math.sin(progress * Math.PI * 4) * (targetMax * 0.05);
                        const noise = randRange(-targetMax*0.02, targetMax*0.02);
                        STATE.targetSpeed = targetMax * 0.9 + wave + noise;
                    }
                    
                    // Actually update the current speed pushing the needle
                    STATE.currentSpeed = lerp(STATE.currentSpeed, STATE.targetSpeed, 0.2);
                    
                    // Update rolling max/avg logic for results
                    if (progress > 0.3) {
                         // average after initial ramp
                         if(!STATE._dlSamples) STATE._dlSamples = [];
                         STATE._dlSamples.push(STATE.currentSpeed);
                         const avg = STATE._dlSamples.reduce((a,b)=>a+b,0) / STATE._dlSamples.length;
                         DOM.resDl.textContent = avg.toFixed(2);
                         STATE.results.dl = avg;
                    }

                    pushSparkline('dl', STATE.currentSpeed);

                }, interval);
            });
        }

        async function phaseUpload() {
            // Setup transition
            STATE.currentSpeed = 0;
            STATE.targetSpeed = 0;
            await new Promise(r => setTimeout(r, 1000)); // Pause between DL and UL

            STATE.status = 'UPLOAD';
            DOM.phaseLabel.textContent = 'UPLOADING DATA';
            DOM.modeLabel.textContent = "UPLOAD";
            
            // UI Styling setup for UL (Purple Theme)
            DOM.meterProgress.className = 'meter-fill-ul';
            DOM.needleCap.style.stroke = CONFIG.colors.purple;
            DOM.panelDl.classList.replace('border-l-neon-cyan', 'border-l-gray-800'); // Dim DL
            DOM.iconDl.classList.replace('text-neon-cyan', 'text-gray-600');
            
            DOM.panelUl.classList.replace('border-l-gray-800', 'border-l-neon-purple');
            DOM.panelUl.classList.replace('text-gray-700', 'text-white');
            DOM.iconUl.classList.replace('text-gray-600', 'text-neon-purple');
            DOM.progUl.parentElement.classList.remove('hidden');
            DOM.resUl.classList.replace('text-gray-700', 'text-white');

            // Upload is typically asymmetrical, lower than DL
            const targetMax = Math.max(50, STATE.results.dl * randRange(0.2, 0.4)); 
            
            let timeElapsed = 0;
            const duration = 8000;
            const interval = 50;
            
            return new Promise(resolve => {
                const timer = setInterval(() => {
                    timeElapsed += interval;
                    const progress = timeElapsed / duration;
                    DOM.progUl.style.width = `${progress * 100}%`;

                    if (progress >= 1) {
                        clearInterval(timer);
                        finalizePhase('ul');
                        resolve();
                        return;
                    }

                    // Upload curve tends to be spikier
                    if (progress < 0.3) {
                        STATE.targetSpeed = lerp(0, targetMax, (progress / 0.3) ** 1.5); // Ease-in
                    } else {
                        const spike = Math.random() > 0.8 ? randRange(-targetMax*0.15, targetMax*0.1) : 0;
                        STATE.targetSpeed = targetMax * randRange(0.9, 1.05) + spike;
                    }
                    
                    STATE.currentSpeed = lerp(STATE.currentSpeed, STATE.targetSpeed, 0.25);
                    
                    if (progress > 0.3) {
                         if(!STATE._ulSamples) STATE._ulSamples = [];
                         STATE._ulSamples.push(STATE.currentSpeed);
                         const avg = STATE._ulSamples.reduce((a,b)=>a+b,0) / STATE._ulSamples.length;
                         DOM.resUl.textContent = avg.toFixed(2);
                         STATE.results.ul = avg;
                    }
                    
                    pushSparkline('ul', STATE.currentSpeed);

                }, interval);
            });
        }

        function finalizePhase(type) {
            if (type === 'dl') {
                DOM.progDl.parentElement.classList.add('hidden');
                DOM.resDl.classList.add('text-glow-cyan', 'text-neon-cyan');
            } else if (type === 'ul') {
                DOM.progUl.parentElement.classList.add('hidden');
                DOM.resUl.classList.add('text-glow-purple', 'text-neon-purple');
            }
        }

        async function runFullTestSequence() {
            if (STATE.status !== 'IDLE' && STATE.status !== 'DONE') return;
            
            // Reset UI State
            DOM.btnStart.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
            setTimeout(() => DOM.btnStart.style.display = 'none', 300);
            
            // Reset numerical results
            ['resPing', 'resJitter', 'resDl', 'resUl'].forEach(id => {
                DOM[id].textContent = '-';
                DOM[id].className = 'text-2xl md:text-4xl font-orbitron font-bold text-gray-700 transition-colors duration-300';
                if(id.includes('Ping')||id.includes('Jitter')) DOM[id].classList.replace('text-4xl','text-2xl');
            });
            DOM.resPing.classList.replace('text-gray-700', 'text-white');
            DOM.resJitter.classList.replace('text-gray-700', 'text-white');
            
            // Reset visuals
            DOM.panelDl.classList.replace('border-l-neon-cyan', 'border-l-gray-800');
            DOM.panelUl.classList.replace('border-l-neon-purple', 'border-l-gray-800');
            DOM.iconDl.className = 'w-5 h-5 text-gray-600 transition-colors duration-300';
            DOM.iconUl.className = 'w-5 h-5 text-gray-600 transition-colors duration-300';
            DOM.sparkDl.innerHTML = '';
            DOM.sparkUl.innerHTML = '';
            STATE._dlSamples = [];
            STATE._ulSamples = [];
            STATE.sparklineData = { dl: [], ul: [] };
            
            // Reset nodes
            document.querySelectorAll('.node-item').forEach(el => {
                el.className = 'node-item border border-gray-800 rounded-lg p-3 flex justify-between items-center bg-gray-900/50 cursor-default';
                el.querySelector('.ping-indicator').textContent = '-- ms';
                el.querySelector('.ping-indicator').className = 'ping-indicator text-xs font-orbitron text-gray-600';
            });

            DOM.meterProgress.className = 'meter-fill-dl';
            DOM.meterProgress.style.strokeDashoffset = CONFIG.arcLength; // reset dial to empty
            
            // Execute sequence
            await phaseRouting();
            await phasePing();
            await phaseDownload();
            await phaseUpload();
            
            // Finish
            STATE.status = 'DONE';
            STATE.currentSpeed = 0; // Return needle to 0
            DOM.modeLabel.style.opacity = '0';
            DOM.unitText.textContent = "";
            DOM.speedText.textContent = "DONE";
            DOM.phaseLabel.textContent = 'SYSTEM STANDBY';
            DOM.phaseLabel.className = 'text-gray-500 text-xs font-bold';
            
            // Restore button
            setTimeout(() => {
                DOM.btnText.textContent = "AGAIN";
                DOM.btnStart.style.display = 'block';
                // Trigger reflow to restart animation
                void DOM.btnStart.offsetWidth; 
                DOM.btnStart.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
            }, 1000);
        }

        // Initialization
        window.onload = function() {
            generateMeterTicks();
            renderNodes();
            
            // Start the physics loop
            STATE.animationFrame = requestAnimationFrame(renderLoop);
            
            // Event Listeners
            DOM.btnStart.addEventListener('click', runFullTestSequence);
        };

    </script>
</body>
</html>
